version: "2"

linters:
  default: standard  # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose  # a leaked response body in an HTTP middleware leaks a connection
    - errorlint
    - misspell
    - wrapcheck  # errors crossing a package boundary say which package they came from

  settings:
    wrapcheck:
      extra-ignore-sigs:
        # a middleware passing the next transport's error along is not the one that
        # should be naming it
        - .RoundTrip(

  exclusions:
    rules:
      # tests close what they open, and report errors to t rather than to a caller who
      # would need to know which package they came from
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - wrapcheck

formatters:
  enable:
    - gofmt
